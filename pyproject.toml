[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-lab"
version = "1.0.0"
description = "Unified autonomous AI agent safety orchestrator, BFT swarm consensus coordinator, and evaluation benchmark harness"
readme = "README.md"
authors = [
    { name = "Lakshitha Dananjaya", email = "devsoniclk@users.noreply.github.com" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = [
    "ai-agents",
    "safety",
    "rollback",
    "consensus",
    "byzantine-fault-tolerance",
    "benchmarking",
    "solana",
    "mcp",
    "merkle-witness"
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "rich>=12.0.0",
    "cryptography>=41.0.0",
    "pydantic>=2.0.0",
    "websockets>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
agent-lab = "agent_lab.cli:main"
agentlab = "agent_lab.cli:main"

[project.urls]
Homepage = "https://github.com/devsoniclk/agent-lab"
Repository = "https://github.com/devsoniclk/agent-lab.git"
Issues = "https://github.com/devsoniclk/agent-lab/issues"
Documentation = "https://github.com/devsoniclk/agent-lab#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_lab*"]

[tool.setuptools.package-data]
agent_lab = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = [
    "asyncio: mark test as asyncio",
]
